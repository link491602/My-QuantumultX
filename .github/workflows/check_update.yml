name: Check Upstream Update

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 时间 2 点执行一次（中国时间早上 10 点）
  workflow_dispatch:      # 允许手动触发一次用于测试

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v3

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/jianlin9133/My-QuantumultX
          git fetch upstream
          git log HEAD..upstream/main --oneline > diff.log

      - name: Check for updates
        run: |
          if [ -s diff.log ]; then
            echo "has_update=true" >> $GITHUB_ENV
          fi

      - name: Send Telegram message if updated
        if: env.has_update == 'true'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="📦 仓库『${{ github.repository }}』有更新啦！%0A📝 提交记录：%0A$(cat diff.log | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Clean up
        run: rm -f diff.log
